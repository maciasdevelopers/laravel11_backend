<p-toast />
<p-toast key="toastNotificacionesUser" position="top-right" [baseZIndex]="5000">
  <ng-template let-message #message>
    <div class="flex flex-col items-start flex-auto">
      <div class="flex items-center gap-2">
        <span class="font-bold">{{message.summary}}</span>
      </div>
      <div class="font-medium text-lg my-4">{{message.detail.asunto || message.detail}}</div>
    </div>
  </ng-template>
</p-toast>
