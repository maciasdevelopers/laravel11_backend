		<div class="col-12 col-sm-9 col-md-3 col-lg-2 col-xl-2 col-xxl-2 row-login">
		  <div class="card-login row">
        
        <div class="col-12 col-sm-12 col-md-3 col-lg-2 col-xl-2 col-xxl-2 encabezado">
          <p class="tlog">&#xf2bd;</p>
          <h6 class="tlog">ACTUALIZA TU CONTRASEÑA</h6>
        </div>

        <div class="col-12 col-sm-12 col-md-3 col-lg-2 col-xl-2 col-xxl-2">
          <form class="formdata_log" id="formActPass" name="formActPass" method="post" autocomplete="off">

            <h6 class="alert">tu contraseña debe contener: al menos 8 caracteres, primer caracter en Mayuscula, 
              al menos 1 numero y un symbolo</h6>
            <div class="input-field">
              <input class="validate" type="password" id="primerCPassword" required (keyup)="keyupPrimerClave($event.target);">
              <label class="active activeInput" for="pass_act" id="lblpass_act">&nbsp;&#xf023; Contraseña</label>
            </div>
          
            <a *ngIf="mayusPrimera == false" class="btn waves-effect waves-light darken-2 btnError">&#xf031;</a>
            <a *ngIf="mayusPrimera == true" class="btn waves-effect waves-light darken-2 btnCorrecto">&#xf031;</a>

            <a *ngIf="numberPrimera == false" class="btn waves-effect waves-light darken-2 btnError">&#xf163;</a>
            <a *ngIf="numberPrimera == true" class="btn waves-effect waves-light darken-2 btnCorrecto">&#xf163;</a>

            <a *ngIf="symbolPrimera == false" class="btn waves-effect waves-light darken-2 btnError">&#xf069;</a>
            <a *ngIf="symbolPrimera == true" class="btn waves-effect waves-light darken-2 btnCorrecto">&#xf069;</a>
  
            <div [class]="strengthClassPrimera"><span></span></div> 
  
            <div class="input-field">
              <input class="validate" type="password" id="secondCPassword" required (keyup)="keyupClaveConfirmacion($event.target);">
              <label class="active activeInput" for="pass_conf" id="lblpass_conf">&nbsp;&#xf023; Confirmar contraseña</label>
            </div>
  
            <a *ngIf="mayusConfirmacion == false" class="btn waves-effect waves-light darken-2 btnError">&#xf031;</a>
            <a *ngIf="mayusConfirmacion == true" class="btn waves-effect waves-light darken-2 btnCorrecto">&#xf031;</a>
            
            <a *ngIf="numberConfirmacion == false" class="btn waves-effect waves-light darken-2 btnError">&#xf163;</a>
            <a *ngIf="numberConfirmacion == true" class="btn waves-effect waves-light darken-2 btnCorrecto">&#xf163;</a>

            <a *ngIf="symbolConfirmacion == false" class="btn waves-effect waves-light darken-2 btnError">&#xf069;</a>
            <a *ngIf="symbolConfirmacion == true" class="btn waves-effect waves-light darken-2 btnCorrecto">&#xf069;</a>
  
            <div [class]="strengthClassConfirmacion"><span></span></div> 
            <p id="eqpassword" class="eqpass"></p>    
            <div id="divCargaActPass" class="progress progressResetPass noneView" role="progressbar" aria-label="Success striped example" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
              <div id="cargaActPass" class="progress-bar progress-bar-striped bg-success" style="width: 100%"></div>
            </div> 

            <div class="col-12">
              <div class="col s10">
                <div class="input-field">
                  <input class="validate" type="password" required (keyup)="keyupClaveOlder($event.target);">
                  <label class="active activeInput" for="pass_conf" id="lblpass_conf">&nbsp;&#xf023; Contraseña anteri&oacute;r</label>
                </div>
              </div>
  
              <div class="col s2">
                <a *ngIf="btnModalActPass == false || contras.passOlder == ''" class="btn bg-blue-300" disabled>&#xf021;</a>
                <a *ngIf="btnModalActPass == true && contras.passOlder != ''" class="btn bg-blue-300" (click)="actualizaPassword($event.target);">&#xf021;</a>
              </div>
            </div>

          </form>  
        </div>

		  </div> 
		</div>
		
	</div>
</div>

<div class="parallax-container">
  <div class="parallax">
    <img src="{{imgFondo}}">
  </div>
</div>
